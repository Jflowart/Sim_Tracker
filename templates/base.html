<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SIM Tracker{% endblock %}</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; font: 15px/1.55 system-ui, -apple-system, Segoe UI, sans-serif;
      background: #f4f5f7; color: #1f2933;
    }
    a { color: #2563eb; text-decoration: none; }
    a:hover { text-decoration: underline; }
    header.top {
      background: #1f2933; color: #fff;
    }
    .top-inner {
      max-width: 1100px; margin: 0 auto; padding: 12px 18px;
      display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
    }
    .brand { font-weight: 700; font-size: 18px; color: #fff; letter-spacing: .3px; }
    .brand span { color: #9aa5b1; font-weight: 400; font-size: 12px; margin-left: 6px; }
    nav { display: flex; gap: 4px; flex-wrap: wrap; }
    nav a {
      color: #cbd2d9; padding: 7px 12px; border-radius: 7px; font-size: 14px;
    }
    nav a:hover { background: #323f4b; text-decoration: none; color: #fff; }
    nav a.active { background: #2563eb; color: #fff; }
    main { max-width: 1100px; margin: 22px auto 60px; padding: 0 18px; }
    .card {
      background: #fff; border: 1px solid #e4e7eb; border-radius: 10px;
      padding: 20px; margin-bottom: 20px; box-shadow: 0 1px 2px rgba(0,0,0,.04);
    }
    h1 { font-size: 22px; margin: 0 0 4px; }
    h2 { margin: 0 0 14px; font-size: 17px; }
    h3 { margin: 0 0 10px; font-size: 14px; }
    label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 6px; }
    input[type=text], input[type=search], input[type=date], select {
      width: 100%; padding: 9px 11px; border: 1px solid #cbd2d9;
      border-radius: 7px; font-size: 14px; background: #fff;
    }
    input[type=file] { font-size: 14px; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
    .row > div { flex: 1 1 200px; }
    button, .btn {
      display: inline-block; background: #2563eb; color: #fff; border: 0;
      border-radius: 7px; padding: 9px 16px; font-size: 14px; font-weight: 600;
      cursor: pointer;
    }
    button:hover, .btn:hover { background: #1d4ed8; text-decoration: none; }
    .btn.secondary, button.secondary { background: #eef2f7; color: #334155; }
    .btn.secondary:hover, button.secondary:hover { background: #e2e8f0; }
    .btn.danger, button.danger { background: #dc2626; }
    .btn.danger:hover, button.danger:hover { background: #b91c1c; }
    .btn.small { padding: 6px 11px; font-size: 13px; }
    .notice {
      background: #fff8e6; border: 1px solid #ffe3a3; color: #6b4e00;
      border-radius: 8px; padding: 12px 14px; font-size: 13px;
    }
    .error, .flash.error {
      background: #fdecec; border: 1px solid #f5b5b5; color: #8a1f1f;
      border-radius: 8px; padding: 12px 14px; margin-bottom: 16px;
    }
    .flash.success {
      background: #e7f6ec; border: 1px solid #b2e0c2; color: #1c6b3a;
      border-radius: 8px; padding: 12px 14px; margin-bottom: 16px;
    }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #eef1f4; }
    th { font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: #616e7c; }
    tbody tr:hover { background: #f8fafc; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; }
    .stat { background: #f8fafc; border: 1px solid #e4e7eb; border-radius: 9px; padding: 14px 16px; }
    .stat .value { font-size: 26px; font-weight: 700; line-height: 1.1; }
    .stat .label { font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: #7b8794; margin-top: 4px; }
    .meta-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
    .meta { background: #f8fafc; border: 1px solid #e4e7eb; border-radius: 8px; padding: 12px 14px; }
    .meta dt { font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: #7b8794; margin-bottom: 4px; }
    .meta dd { margin: 0; font-weight: 600; word-break: break-word; }
    .map-frame { width: 100%; height: 460px; border: 1px solid #e4e7eb; border-radius: 8px; }
    .muted { color: #7b8794; font-size: 13px; }
    .badge { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; }
    .badge.pending { background: #eef2f7; color: #52606d; }
    .badge.running { background: #fff3cd; color: #8a6d3b; }
    .badge.done { background: #e7f6ec; color: #1c6b3a; }
    .badge.failed { background: #fdecec; color: #8a1f1f; }
    .pagination { display: flex; gap: 8px; align-items: center; margin-top: 14px; flex-wrap: wrap; }
    .toolbar { display: flex; gap: 10px; justify-content: space-between; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
    footer { max-width: 1100px; margin: 0 auto; padding: 0 18px 30px; color: #7b8794; font-size: 12px; }
    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
    code { background: #eef2f7; padding: 1px 5px; border-radius: 4px; font-size: 13px; }
  </style>
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <div class="brand">SIM Tracker <span>phone metadata &middot; country-level only</span></div>
      <nav>
        <a href="{{ url_for('dashboard') }}" class="{{ 'active' if request.endpoint == 'dashboard' }}">Dashboard</a>
        <a href="{{ url_for('lookup') }}" class="{{ 'active' if request.endpoint == 'lookup' }}">Lookup</a>
        <a href="{{ url_for('batch') }}" class="{{ 'active' if request.endpoint == 'batch' }}">Batch</a>
        <a href="{{ url_for('history') }}" class="{{ 'active' if request.endpoint == 'history' }}">History</a>
      </nav>
    </div>
  </header>
  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
  <footer>{{ disclaimer }} &middot; v{{ version }}</footer>
</body>
</html>
